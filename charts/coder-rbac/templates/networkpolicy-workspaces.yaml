{{- if .Values.networkPolicy.workspaceEgress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coder-rbac.fullname" . }}-workspace-egress
  namespace: {{ default .Release.Namespace .Values.networkPolicy.workspaceEgress.namespace }}
  labels:
    {{- include "coder-rbac.labels" . | nindent 4 }}
spec:
  podSelector:
    {{- toYaml .Values.networkPolicy.workspaceEgress.podSelector | nindent 4 }}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "coder-rbac.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.proxyPort }}
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.workspaceEgress.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.workspaceEgress.dns.podSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with .Values.networkPolicy.workspaceEgress.additionalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
