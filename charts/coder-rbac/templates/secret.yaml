{{- if hasKey .Values.config "allowedUserIDs" -}}
{{- fail "config.allowedUserIDs is no longer supported; use config.adminUsernames" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coder-rbac.fullname" . }}
  labels:
    {{- include "coder-rbac.labels" . | nindent 4 }}
type: Opaque
stringData:
  CODER_RBAC_ADMIN_USERNAMES: {{ join "," .Values.config.adminUsernames | quote }}
  CODER_RBAC_ALLOWED_USERNAMES: {{ join "," .Values.config.allowedUsernames | quote }}
