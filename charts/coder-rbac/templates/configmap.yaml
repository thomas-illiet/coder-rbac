{{- $upstream := required "config.upstreamURL is required" .Values.config.upstreamURL -}}
{{- $public := required "config.publicURL is required" .Values.config.publicURL -}}
{{- $wildcard := required "config.wildcardAccessHost is required" .Values.config.wildcardAccessHost -}}
{{- $serviceName := include "coder-rbac.fullname" . -}}
{{- $builtInHosts := list $serviceName (printf "%s.%s" $serviceName .Release.Namespace) (printf "%s.%s.svc" $serviceName .Release.Namespace) (printf "%s.%s.svc.cluster.local" $serviceName .Release.Namespace) -}}
{{- $internalHosts := concat $builtInHosts .Values.config.internalHosts -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coder-rbac.fullname" . }}
  labels:
    {{- include "coder-rbac.labels" . | nindent 4 }}
data:
  CODER_RBAC_UPSTREAM_URL: {{ $upstream | quote }}
  CODER_RBAC_PUBLIC_URL: {{ $public | quote }}
  CODER_RBAC_WILDCARD_ACCESS_HOST: {{ $wildcard | quote }}
  CODER_RBAC_INTERNAL_HOSTS: {{ join "," $internalHosts | quote }}
  CODER_RBAC_EXPECTED_VERSION_PREFIX: {{ required "config.expectedVersionPrefix is required" .Values.config.expectedVersionPrefix | quote }}
  CODER_RBAC_LISTEN_ADDRESS: {{ printf ":%v" .Values.service.proxyPort | quote }}
  CODER_RBAC_HEALTH_LISTEN_ADDRESS: {{ printf ":%v" .Values.service.healthPort | quote }}
  CODER_RBAC_METRICS_LISTEN_ADDRESS: {{ printf ":%v" .Values.service.metricsPort | quote }}
  CODER_RBAC_VERSION_CHECK_INTERVAL: {{ .Values.config.versionCheckInterval | quote }}
  CODER_RBAC_UPSTREAM_TIMEOUT: {{ .Values.config.upstreamTimeout | quote }}
  CODER_RBAC_SHUTDOWN_TIMEOUT: {{ .Values.config.shutdownTimeout | quote }}
  CODER_RBAC_MAX_INSPECTION_BODY_BYTES: {{ printf "%d" (int64 .Values.config.maxInspectionBodyBytes) | quote }}
