{{- if hasKey .Values.config "allowedUserIDs" -}}
{{- fail "config.allowedUserIDs is no longer supported; use config.adminUsernames" -}}
{{- end -}}
{{- $secretName := include "coder-policy.fullname" . -}}
{{- $logoutCSRFSecret := .Values.config.logoutCSRFSecret -}}
{{- if and (gt (int .Values.replicaCount) 1) (eq $logoutCSRFSecret "") -}}
{{- fail "config.logoutCSRFSecret is required when replicaCount is greater than one" -}}
{{- end -}}
{{- if and (ne $logoutCSRFSecret "") (lt (len $logoutCSRFSecret) 32) -}}
{{- fail "config.logoutCSRFSecret must contain at least 32 characters" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "coder-policy.labels" . | nindent 4 }}
type: Opaque
stringData:
  CODER_POLICY_ADMIN_USERNAMES: {{ join "," .Values.config.adminUsernames | quote }}
  CODER_POLICY_ALLOWED_USERNAMES: {{ join "," .Values.config.allowedUsernames | quote }}
  CODER_POLICY_LOGOUT_CSRF_SECRET: {{ $logoutCSRFSecret | quote }}
