{{- if .Values.ingress.main.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "coder-policy.fullname" . }}
  labels:
    {{- include "coder-policy.labels" . | nindent 4 }}
  {{- with .Values.ingress.main.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.main.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "ingress.main.host is required when main ingress is enabled" .Values.ingress.main.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "coder-policy.fullname" . }}
                port:
                  name: http
  {{- if .Values.ingress.main.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.main.host | quote }}
      secretName: {{ required "ingress.main.tls.secretName is required when TLS is enabled" .Values.ingress.main.tls.secretName }}
  {{- end }}
{{- end }}
