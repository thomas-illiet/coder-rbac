apiVersion: v1
kind: Service
metadata:
  name: {{ include "coder-policy.fullname" . }}
  labels:
    {{- include "coder-policy.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "coder-policy.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.proxyPort }}
      targetPort: http
      protocol: TCP
    - name: health
      port: {{ .Values.service.healthPort }}
      targetPort: health
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
